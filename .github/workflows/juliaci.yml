name: Julia CI

on:
  push: {branches: [main, master], tags: ['**']}
  pull_request: {types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]}
  issue_comment: {types: [created]}
  workflow_dispatch:
    inputs:
      feature:
        type: choice
        description: What to run
        options: [DocDeploy, LintAndTest, TagBot]

jobs:
  julia-ci:
    uses: julia-testitems/testitem-workflow/.github/workflows/juliaci.yml@v2
    with:
      include-linux-x86: false
      include-windows-x64: false
      include-windows-x86: false
      include-macos-x64: false
      include-macos-aarch64: false
      draft-pr-include-lts-versions: false
    permissions: write-all
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
  docs-preview:
    name: Documentation preview
    needs: julia-ci
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    environment:
      name: docs-preview-pr-${{ github.event.pull_request.number }}
      url: https://juliauq.github.io/TransportMaps.jl/previews/PR${{ github.event.pull_request.number }}/
    steps:
      - name: Verify preview is available
        env:
          PREVIEW_URL: https://juliauq.github.io/TransportMaps.jl/previews/PR${{ github.event.pull_request.number }}/
        run: |
          curl --fail --silent --show-error --location \
            --retry 8 --retry-all-errors --retry-delay 10 \
            --output /dev/null "$PREVIEW_URL"